<!doctype html><html><head><title>Drag</title></head><body>
<h1>Drag</h1>
<div id="src" style="width:80px;height:40px;background:#ddd" onmousedown="this.dataset.down='1'">source</div>
<div id="dst" style="width:160px;height:80px;background:#eee;margin-top:20px" onmouseup="document.getElementById('out').textContent='dropped'">target</div>
<p id="out"></p>
</body></html>
