<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="monad-browser logo">
  <defs>
    <linearGradient id="mb-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="mb-glyph" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a5b4fc"/>
      <stop offset="0.5" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="mb-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feColorMatrix in="b" type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.36  0 0 0 0 0.96  0 0 0 0.55 0"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="224" height="224" rx="58" fill="url(#mb-tile)"/>
  <rect x="16" y="16" width="224" height="224" rx="58" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>

  <!-- viewport window -->
  <rect x="50" y="56" width="156" height="144" rx="22" fill="#0a0f1e" opacity="0.94"/>
  <rect x="50" y="56" width="156" height="144" rx="22" fill="none" stroke="url(#mb-glyph)" stroke-opacity="0.35" stroke-width="2"/>

  <!-- chrome -->
  <circle cx="70" cy="76" r="4.4" fill="#f87171"/>
  <circle cx="85" cy="76" r="4.4" fill="#fbbf24"/>
  <circle cx="100" cy="76" r="4.4" fill="#34d399"/>

  <!-- monad M monogram -->
  <path d="M78 178 V116 L110 150 L142 116 V178"
        fill="none" stroke="url(#mb-glyph)" stroke-width="15"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="110" cy="150" r="8" fill="url(#mb-glyph)" filter="url(#mb-soft)"/>
  <circle cx="110" cy="150" r="4.4" fill="#eef2ff"/>

  <!-- agent cursor -->
  <path d="M171 150 l30 12 -12.5 4.5 -4.5 12.5 z" fill="#22d3ee" stroke="#0a0f1e" stroke-width="3" stroke-linejoin="round"/>
</svg>
