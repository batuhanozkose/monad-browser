</defs><text x="28" y="36" class="fg" font-size="20" font-weight="700">Agent tasks — total tokens read</text><text x="28" y="58" class="mu" font-size="13">form · HN comments · books pagination · wiki search  ·  lower is better</text><rect x="210.0" y="84.0" width="540.0" height="27" rx="6" class="tr"/><rect x="210" y="84" width="66.6" height="27" rx="6" fill="url(#grad)"/><text x="196" y="102.5" text-anchor="end" class="fg" font-size="13" font-weight="700">monad CLI</text><text x="288.5753424657534" y="102.5" class="hi" font-size="13" font-weight="600">45k <tspan class="fa" font-weight="400">· 12 calls</tspan></text><rect x="210.0" y="124.0" width="540.0" height="27" rx="6" class="tr"/><rect x="210.0" y="124.0" width="41.4" height="27" rx="6" class="ot"/><text x="196" y="142.5" text-anchor="end" class="fg" font-size="13" font-weight="500">agent-browser</text><text x="263.4246575342466" y="142.5" class="mu" font-size="13" font-weight="600">28k <tspan class="fa" font-weight="400">· 24 calls</tspan></text><rect x="210.0" y="164.0" width="540.0" height="27" rx="6" class="tr"/><rect x="210.0" y="164.0" width="112.4" height="27" rx="6" class="h2"/><text x="196" y="182.5" text-anchor="end" class="fg" font-size="13" font-weight="500">monad MCP</text><text x="334.43835616438355" y="182.5" class="hi" font-size="13" font-weight="600">76k <tspan class="fa" font-weight="400">· 12 calls</tspan></text><rect x="210.0" y="204.0" width="540.0" height="27" rx="6" class="tr"/><rect x="210.0" y="204.0" width="474.9" height="27" rx="6" class="ot"/><text x="196" y="222.5" text-anchor="end" class="fg" font-size="13" font-weight="500">Chrome DevTools MCP</text><text x="696.9041095890411" y="222.5" class="mu" font-size="13" font-weight="600">321k <tspan class="fa" font-weight="400">· 22 calls</tspan></text><rect x="210.0" y="244.0" width="540.0" height="27" rx="6" class="tr"/><rect x="210.0" y="244.0" width="537.0" height="27" rx="6" class="ot"/><text x="196" y="262.5" text-anchor="end" class="fg" font-size="13" font-weight="500">Playwright CLI</text><text x="759.0410958904109" y="262.5" class="mu" font-size="13" font-weight="600">363k <tspan class="fa" font-weight="400">· 23 calls</tspan></text><rect x="210.0" y="284.0" width="540.0" height="27" rx="6" class="tr"/><rect x="210.0" y="284.0" width="540.0" height="27" rx="6" class="ot"/><text x="196" y="302.5" text-anchor="end" class="fg" font-size="13" font-weight="500">Playwright MCP</text><text x="762.0" y="302.5" class="mu" font-size="13" font-weight="600">365k <tspan class="fa" font-weight="400">· 23 calls</tspan></text><text x="210" y="352" class="fa" font-size="12">monad trades fewer calls (12 vs 23–24) for more tokens on navigation tasks; agent-browser reads fewer tokens but takes ~2× the calls.</text>
