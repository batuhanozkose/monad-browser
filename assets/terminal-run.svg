<text x="92" y="26.0" fill="#8b96ad" font-size="13">mb run — whole task, one call</text>
<text x="26.0" y="66" fill="#3fb950">$</text><text x="42.6" y="66" fill="#e6edf3">mb run '</text>
<text x="59.2" y="88" fill="#e6edf3">await goto("books.toscrape.com");</text>
<text x="59.2" y="110" fill="#e6edf3">const titles = [];</text>
<text x="59.2" y="132" fill="#e6edf3">for (let i = 0; i &lt; 3; i++) {</text>
<text x="75.8" y="154" fill="#e6edf3">titles.push(...await js("[...document.querySelectorAll(\"h3 a\")].map(a =&gt; a.title)"));</text>
<text x="75.8" y="176" fill="#e6edf3">await click("text=next");</text>
<text x="59.2" y="198" fill="#e6edf3">}</text>
<text x="59.2" y="220" fill="#e6edf3">return titles.length;</text>
<text x="42.6" y="242" fill="#e6edf3">'</text>
