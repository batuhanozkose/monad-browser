<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="monad-browser — headless, turnkey browser CLI for AI agents">
  <defs>
    <linearGradient id="bn-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1c"/>
      <stop offset="0.5" stop-color="#0d1428"/>
      <stop offset="1" stop-color="#0a1220"/>
    </linearGradient>
    <radialGradient id="bn-glow" cx="0.18" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bn-glow2" cx="0.95" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bn-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="bn-glyph" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a5b4fc"/>
      <stop offset="0.5" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="bn-word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c7d2fe"/>
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="bn-num" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bn-bg)"/>
  <rect width="1280" height="320" fill="url(#bn-glow)"/>
  <rect width="1280" height="320" fill="url(#bn-glow2)"/>
  <rect x="0.5" y="0.5" width="1279" height="319" rx="0" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- brand mark -->
  <g transform="translate(64 74) scale(0.68)">
    <rect x="16" y="16" width="224" height="224" rx="58" fill="url(#bn-tile)"/>
    <rect x="16" y="16" width="224" height="224" rx="58" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
    <rect x="50" y="56" width="156" height="144" rx="22" fill="#0a0f1e" opacity="0.94"/>
    <rect x="50" y="56" width="156" height="144" rx="22" fill="none" stroke="url(#bn-glyph)" stroke-opacity="0.35" stroke-width="2"/>
    <circle cx="70" cy="76" r="4.4" fill="#f87171"/>
    <circle cx="85" cy="76" r="4.4" fill="#fbbf24"/>
    <circle cx="100" cy="76" r="4.4" fill="#34d399"/>
    <path d="M78 178 V116 L110 150 L142 116 V178" fill="none" stroke="url(#bn-glyph)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="110" cy="150" r="4.4" fill="#eef2ff"/>
    <path d="M171 150 l30 12 -12.5 4.5 -4.5 12.5 z" fill="#22d3ee" stroke="#0a0f1e" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- wordmark -->
  <text x="262" y="150" font-family="Inter, 'Segoe UI', -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="-2" fill="url(#bn-word)">monad-browser</text>
  <text x="264" y="196" font-family="Inter, 'Segoe UI', -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="500" fill="#93a4c3">Headless, turnkey browser CLI for AI agents.</text>

  <!-- chips -->
  <g font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" fill="#c3cdea">
    <g>
      <rect x="264" y="224" width="112" height="38" rx="19" fill="#6366f1" fill-opacity="0.14" stroke="#6366f1" stroke-opacity="0.5"/>
      <text x="320" y="249" text-anchor="middle">raw CDP</text>
    </g>
    <g>
      <rect x="388" y="224" width="164" height="38" rx="19" fill="#8b5cf6" fill-opacity="0.14" stroke="#8b5cf6" stroke-opacity="0.5"/>
      <text x="470" y="249" text-anchor="middle">stable @refs</text>
    </g>
    <g>
      <rect x="564" y="224" width="196" height="38" rx="19" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="662" y="249" text-anchor="middle">warm daemon ~40 ms</text>
    </g>
    <g>
      <rect x="772" y="224" width="122" height="38" rx="19" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="833" y="249" text-anchor="middle">CLI + MCP</text>
    </g>
  </g>

  <!-- stat card -->
  <g transform="translate(944 70)">
    <rect width="280" height="192" rx="22" fill="#0e1730" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="30" y="52" font-family="Inter, 'Segoe UI', -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#93a4c3">snapshot cost · same 6 pages</text>
    <text x="28" y="132" font-family="Inter, 'Segoe UI', -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="-2" fill="url(#bn-num)">47k<tspan font-size="28" font-weight="600" fill="#c3cdea"> tokens</tspan></text>
    <text x="30" y="172" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" fill="#7f8fb3">vs Playwright 184k</text>
  </g>
</svg>
